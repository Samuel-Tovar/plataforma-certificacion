<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Noticias y oportunidades | ASEUTP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header-principal">

        <div class="logo">
            <a href="index.html">
                <img
                    src="../assets/img/logo-aseutp.png"
                    alt="Asociación de Egresados UTP"
                >
            </a>
        </div>

        <nav class="menu-principal">

            <a href="index.html">
                Inicio
            </a>

            <a href="nosotros.html">
                Nosotros
            </a>

            <div id="auth-area"></div>

        </nav>

    </header>


    <main class="pagina-contenido">

        <h1>Noticias y oportunidades</h1>

        <p>
            Consulta las últimas noticias, convenios y oportunidades
            disponibles para la comunidad de egresados.
        </p>


        <div class="filtros-publicaciones">

            <button
                class="filtro activo-filtro"
                data-tipo="todos"
            >
                Todos
            </button>

            <button
                class="filtro"
                data-tipo="noticia"
            >
                Noticias
            </button>

            <button
                class="filtro"
                data-tipo="convenio"
            >
                Convenios
            </button>

            <button
                class="filtro"
                data-tipo="empleo"
            >
                Empleo
            </button>

        </div>


        <section
            id="contenedorPublicaciones"
            class="grid-publicaciones"
        >
        </section>

    </main>


    <!-- Lógica propia de noticias -->
    <script src="noticias.js"></script>


    <!-- Control de sesión -->
    <script
        type="module"
        src="js/auth-state.js">
    </script>


    <!-- Opciones de cuenta -->
    <script
        type="module"
        src="js/cuenta.js">
    </script>

</body>

</html>
