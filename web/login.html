<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | ASEUTP</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="contenedor-formulario">

        <div class="formulario">

            <a
                href="index.html"
                class="volver"
            >
                ← Volver al inicio
            </a>

            <h1>
                Iniciar sesión
            </h1>

            <p>
                Ingresa con tu correo y contraseña.
            </p>


            <form>

                <label for="correoLogin">
                    Correo
                </label>

                <input
                    type="email"
                    id="correoLogin"
                    required
                >


                <label for="passwordLogin">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="passwordLogin"
                    required
                >


                <button
                    type="submit"
                    class="boton-principal"
                >
                    Iniciar sesión
                </button>

            </form>


            <p class="enlace-formulario">

                ¿No tienes una cuenta?

                <a href="registro.html">
                    Registrarse
                </a>

            </p>

        </div>

    </main>

</body>

</html>
