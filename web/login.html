<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | ASEUTP</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="contenedor-formulario">

        <div class="formulario">

            <a
                href="index.html"
                class="volver"
            >
                ← Volver al inicio
            </a>


            <h1>
                Iniciar sesión
            </h1>


            <p>
                Ingresa con tu correo y contraseña.
            </p>


            <form id="formLogin">

                <label for="correo">
                    Correo
                </label>

                <input
                    type="email"
                    id="correo"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >


                <div
                    id="mensajeLogin"
                    class="mensaje-registro"
                ></div>


                <button
                    type="submit"
                    class="boton-principal"
                >
                    Iniciar sesión
                </button>

            </form>


            <p class="enlace-formulario">

                ¿No tienes una cuenta?

                <a href="registro.html">
                    Registrarse
                </a>

            </p>

        </div>

    </main>


    <script
        type="module"
        src="js/login.js"
    ></script>


</body>

</html>
